<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی انفجار VIP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 420px;
            margin: auto;
            background: #161e2e;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
        }
        .header {
            display: flex;
            justify-content: space-between;
            background: #1e293b;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 15px;
        }
        .balance { color: #facc15; font-weight: bold; }
        .game-box {
            position: relative;
            height: 200px;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        .multiplier {
            font-size: 42px;
            font-weight: bold;
            color: #38bdf8;
            z-index: 2;
        }
        .rocket {
            position: absolute;
            left: 20px;
            bottom: 20px;
            font-size: 32px;
            transition: all 0.1s linear;
            z-index: 1;
        }
        .crashed { color: #ef4444 !important; }
        .win { color: #22c55e !important; }
        
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            box-sizing: border-box;
        }
        input {
            background: #334155;
            color: white;
            text-align: center;
            font-weight: bold;
        }
        .btn-start {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-cashout {
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        .btn-deposit {
            background: #d97706;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .players-box {
            margin-top: 15px;
            background: #0f172a;
            border-radius: 10px;
            padding: 10px;
            max-height: 130px;
            overflow-y: auto;
            font-size: 13px;
            text-align: right;
            border: 1px solid #334155;
        }
        .player-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #1e293b;
        }
        .p-win { color: #22c55e; }
        .p-loss { color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span>👤 کاربر VIP</span>
            <span class="balance">💰 <span id="balance">1000</span> سکه</span>
        </div>

        <div class="game-box">
            <div class="rocket" id="rocket">🚀</div>
            <div class="multiplier" id="multiplierDisplay">1.00x</div>
        </div>

        <div>
            <input type="number" id="betAmount" value="100" min="100">
        </div>

        <button class="btn-start" id="startBtn" onclick="startGame()">شروع شرط‌بندی</button>
        <button class="btn-cashout" id="cashoutBtn" onclick="cashOut()">برداشت جایزه (Cash Out)</button>
        <button class="btn-deposit" onclick="openDeposit()">💳 افزایش موجودی (کارت به کارت)</button>

        <div class="players-box" id="playersList">
            <div style="color: #94a3b8; text-align: center; margin-bottom: 5px;">live کاربران آنلاین در حال بازی</div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 1000;
        let currentMultiplier = 1.00;
        let gameInterval = null;
        let crashPoint = 1.00;
        let gameInProgress = false;
        let cashedOut = false;
        let bet = 100;

        // اسامی کاربران فیک برای ایجاد هیجان واقعی
        const fakeNames = ["Ali_King", "Reza_Trid", "Sara_99", "Milad_Bazi", "Crypto_Pro", "Nima_20", "Babak_Vip", "Saeed_Boom"];

        function startGame() {
            bet = parseInt(document.getElementById('betAmount').value);
            if (bet < 100) {
                alert("حداقل مبلغ شرط ۱۰۰ سکه است!");
                return;
            }
            if (bet > balance) {
                alert("موجودی کافی نیست! لطفا حساب خود را شارژ کنید.");
                return;
            }

            balance -= bet;
            document.getElementById('balance').innerText = balance;

            currentMultiplier = 1.00;
            cashedOut = false;
            gameInProgress = true;
            
            let display = document.getElementById('multiplierDisplay');
            display.className = "multiplier";
            let rocket = document.getElementById('rocket');
            rocket.style.bottom = "20px";
            rocket.style.left = "20px";
            
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('cashoutBtn').style.display = 'block';
            document.getElementById('betAmount').disabled = true;

            // کنترل ضریب (سیاست برد سمت خانه / احتمال انفجار سریع‌تر برای سود مدیر)
            let randomChance = Math.random();
            if (randomChance < 0.6) {
                crashPoint = (Math.random() * (1.8 - 1.1) + 1.1).toFixed(2); // 60 درصد مواقع زود منفجر میشه
            } else if (randomChance < 0.9) {
                crashPoint = (Math.random() * (4.5 - 1.9) + 1.9).toFixed(2); // 30 درصد مواقع متوسط
            } else {
                crashPoint = (Math.random() * (12.0 - 4.6) + 4.6).toFixed(2); // 10 درصد مواقع ضریب بالا
            }

            gameInterval = setInterval(() => {
                currentMultiplier += 0.04;
                display.innerText = currentMultiplier.toFixed(2) + 'x';
                
                // حرکت موشک روی صفحه به صورت گرافیکی
                let bottomPos = Math.min(140, 20 + (currentMultiplier * 15));
                let leftPos = Math.min(250, 20 + (currentMultiplier * 20));
                rocket.style.bottom = bottomPos + 'px';
                rocket.style.left = leftPos + 'px';

                if (currentMultiplier >= crashPoint) {
                    clearInterval(gameInterval);
                    if (!cashedOut) {
                        display.innerText = crashPoint + 'x (انفجار!)';
                        display.className = "multiplier crashed";
                        rocket.innerHTML = "💥";
                        endGame();
                    }
                }
            }, 90);
        }

        function cashOut() {
            if (!gameInProgress || cashedOut) return;
            cashedOut = true;
            clearInterval(gameInterval);

            let winAmount = Math.floor(bet * currentMultiplier);
            balance += winAmount;
            document.getElementById('balance').innerText = balance;

            let display = document.getElementById('multiplierDisplay');
            display.innerText = currentMultiplier.toFixed(2) + 'x (برد 🎉)';
            display.className = "multiplier win";

            endGame();
            tg.HapticFeedback.notificationOccurred('success');
        }

        function endGame() {
            gameInProgress = false;
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('cashoutBtn').style.display = 'none';
            document.getElementById('betAmount').disabled = false;
            setTimeout(() => { document.getElementById('rocket').innerHTML = "🚀"; }, 2000);
        }

        function openDeposit() {
            // هدایت به ربات تلگرام برای کارت به کارت
            window.open("https://t.me/" + tg.initDataUnsafe?.receiver?.username || "bot", "_blank");
            alert("برای افزایش موجودی و کارت به کارت، لطفا به ربات تلگرامی پیام دهید و رسید خود را ارسال کنید.");
        }

        // شبیه‌سازی زنده کاربران فیک در حال بازی
        setInterval(() => {
            let pList = document.getElementById('playersList');
            let randomName = fakeNames[Math.floor(Math.random() * fakeNames.length)];
            let randomBet = Math.floor(Math.random() * 900 + 100);
            let isWin = Math.random() > 0.4;
            let randomMult = (Math.random() * 3 + 1.2).toFixed(2);

            let row = document.createElement('div');
            row.className = "player-row";
            if(isWin) {
                let winVal = Math.floor(randomBet * randomMult);
                row.innerHTML = `<span>👤 ${randomName} (${randomBet}ت)</span> <span class="p-win">برد: ${winVal} (${randomMult}x)</span>`;
            } else {
                row.innerHTML = `<span>👤 ${randomName} (${randomBet}ت)</span> <span class="p-loss">باخت (انفجار)</span>`;
            }

            pList.prepend(row);
            if (pList.children.length > 6) {
                pList.removeChild(pList.lastChild);
            }
        }, 3000);
    </script>
</body>
</html>
