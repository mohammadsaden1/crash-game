<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی انفجار حرفه‌ای</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .multiplier {
            font-size: 48px;
            font-weight: bold;
            color: #38bdf8;
            margin: 30px 0;
        }
        .crashed {
            color: #ef4444 !important;
        }
        .win {
            color: #22c55e !important;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        input {
            background: #334155;
            color: white;
            text-align: center;
        }
        .btn-start {
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-cashout {
            background: #16a34a;
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        .balance {
            font-size: 18px;
            margin-bottom: 15px;
            color: #facc15;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎲 بازی انفجار تلگرامی</h2>
        <div class="balance">موجودی: <span id="balance">1000</span> سکه</div>

        <div>
            <label>مبلغ شرط:</label>
            <input type="number" id="betAmount" value="100">
        </div>

        <div class="multiplier" id="multiplierDisplay">1.00x</div>

        <button class="btn-start" id="startBtn" onclick="startGame()">شروع بازی</button>
        <button class="btn-cashout" id="cashoutBtn" onclick="cashOut()">برداشت (Cash Out)</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // تمام صفحه کردن مینی‌اپ در تلگرام

        let balance = 1000;
        let currentMultiplier = 1.00;
        let gameInterval = null;
        let crashPoint = 1.00;
        let gameInProgress = false;
        let cashedOut = false;
        let bet = 100;

        function startGame() {
            bet = parseInt(document.getElementById('betAmount').value);
            if (bet > balance || bet <= 0) {
                alert("موجودی کافی نیست یا مبلغ نامعتبر است!");
                return;
            }

            balance -= bet;
            document.getElementById('balance').innerText = balance;

            currentMultiplier = 1.00;
            cashedOut = false;
            gameInProgress = true;
            
            let display = document.getElementById('multiplierDisplay');
            display.className = "multiplier";
            
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('cashoutBtn').style.display = 'block';
            document.getElementById('betAmount').disabled = true;

            // تعیین تصادفی ضریب انفجار (بین 1.1 تا 10)
            crashPoint = (Math.random() * (10 - 1.1) + 1.1).toFixed(2);

            gameInterval = setInterval(() => {
                currentMultiplier += 0.03; // سرعت رشد ضریب
                display.innerText = currentMultiplier.toFixed(2) + 'x';

                if (currentMultiplier >= crashPoint) {
                    clearInterval(gameInterval);
                    if (!cashedOut) {
                        // باخت
                        display.innerText = crashPoint + 'x (انفجار!)';
                        display.className = "multiplier crashed";
                        endGame();
                    }
                }
            }, 100);
        }

        function cashOut() {
            if (!gameInProgress || cashedOut) return;
            cashedOut = true;
            clearInterval(gameInterval);

            let winAmount = Math.floor(bet * currentMultiplier);
            balance += winAmount;
            document.getElementById('balance').innerText = balance;

            let display = document.getElementById('multiplierDisplay');
            display.innerText = currentMultiplier.toFixed(2) + 'x (برد!)';
            display.className = "multiplier win";

            endGame();
            tg.HapticFeedback.notificationOccurred('success'); // لرزش گوشی در صورت برد
        }

        function endGame() {
            gameInProgress = false;
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('cashoutBtn').style.display = 'none';
            document.getElementById('betAmount').disabled = false;
        }
    </script>
</body>
</html>
